name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["[0-9]*.*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Used by every `docker compose` call in this job
      COMPOSE_FILE: docker/docker-compose.yml:docker/docker-compose.airgapped.yml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ghcr.io/bal-dmu/fhir2sphn:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Simulate an airgapped environment: everything the image needs must be baked
      # in at build time (above). From here on the container gets no internet access.
      # Traffic forwarded out of the container's bridge is rejected; host <-> container
      # traffic (tests on localhost:8080, docker exec) is local and unaffected.
      - name: Block internet access for the container
        run: |
          sudo iptables  -I DOCKER-USER -i br-airgapped ! -o br-airgapped -j REJECT
          sudo ip6tables -I DOCKER-USER -i br-airgapped ! -o br-airgapped -j REJECT || true
          sudo iptables -L DOCKER-USER -v -n

      - name: Start container (airgapped)
        run: |
          docker compose up -d --pull never
          sleep 60
          docker compose logs

      - name: Verify container has no internet access
        run: |
          # Without this check, a container that already exited would make every
          # `exec` below fail and wrongly count as "unreachable".
          if [ -z "$(docker compose ps -q --status running fhir2sphn)" ]; then
            echo "::error::fhir2sphn container is not running"
            docker compose ps -a
            exit 1
          fi
          for url in https://packages.fhir.org https://github.com http://1.1.1.1; do
            if docker compose exec -T fhir2sphn curl -sS --max-time 10 -o /dev/null "$url"; then
              echo "::error::Container reached $url - airgap is not in effect"
              exit 1
            fi
            echo "OK: $url unreachable"
          done

      - name: Run tests
        run: pytest tests/ --skip-sds -v # SDs have been built when building the container

      - name: Dump container logs
        if: always()
        run: docker compose logs

      - name: Stop container
        if: always()
        run: docker compose down

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          echo "tag=$PREV" >> $GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
            RANGE="${{ steps.prev_tag.outputs.tag }}..${{ github.ref_name }}"
          else
            RANGE="HEAD"
          fi
          {
            echo "body<<EOF"
            git log $RANGE --oneline
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Is stable release
        id: stable
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "yes=true" >> $GITHUB_OUTPUT
          else
            echo "yes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.stable.outputs.yes != 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/fhir2sphn:${{ github.ref_name }}
            ${{ steps.stable.outputs.yes == 'true' && format('ghcr.io/{0}/fhir2sphn:latest', steps.owner.outputs.name) || '' }}
          push: true
          cache-from: type=gha

      - name: Prepare docker-compose.yml for release
        run: |
          sed 's|:latest|:${{ github.ref_name }}|' docker/docker-compose.prod.yml > docker-compose.yml

      - name: Upload docker-compose.yml to release
        uses: softprops/action-gh-release@v2
        with:
          files: docker-compose.yml
